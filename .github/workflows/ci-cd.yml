on:
  push: { branches: [develop, production] }
  pull_request: { branches: [develop, production] }
jobs:
  ci:
  steps:
  - run: npm ci
  - run: npx prisma validate
  - run: npm run typecheck
  - run: npm test
  deploy:
    needs: ci
    if: github.ref = 'refs/heads/production'
    steps:
    - run: curl -fail "$RENDER_DEPLOY_HOOK_URL"